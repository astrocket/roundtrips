name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rspec:
    # ubuntu-latest (26.04) has no Ruby 4.0 binaries yet, so pin 24.04.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        ruby: ["3.3", "4.0.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec
